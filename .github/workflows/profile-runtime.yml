name: Profile runtime

on:
  push:
    paths:
      - "src/**"
      - "scripts/verify*"
      - "package*.json"
      - ".github/workflows/profile-runtime.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/verify*"
      - "package*.json"
      - ".github/workflows/profile-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/verify-profile-runtime.mjs
      - run: node scripts/verify-profile-runtime-native.cjs
      - run: node scripts/verify-env-wizard.cjs --runtime
